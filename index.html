<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私の最初のホームページ</title>
    <style>
        /* 全体の背景色と文字色の設定 */
        body {
            background-color: #e0f7fa;
            color: #333333;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* プロフィールカードのコンテナ */
        .profile-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }

        /* 見出しのスタイリング */
        h1 {
            color: #00838f;
            border-bottom: 2px solid #00acc1;
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* リストのスタイリング */
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        /* ラベル（項目名）の強調 */
        .label {
            font-weight: bold;
            color: #006064;
            display: inline-block;
            width: 100px;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>ようこそ!</h1>
        
        <ul>
            <li><span class="label">名前:</span> 佐藤孝哉</li>
            <li><span class="label">学部学科:</span> 理工学部 応用情報工学科</li>
            <li><span class="label">趣味:</span> FPSゲーム、剣道</li>
        </ul>
    </div>

</body>
</html>
